<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>
    // Failsafe: Hard reload if Vite's main module chunk fails to load due to stale index.html cache
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.match(/\/assets\/index-.*\.js/)) {
         var reloaded = sessionStorage.getItem('vite-recovery-reload');
         if (!reloaded) {
           sessionStorage.setItem('vite-recovery-reload', 'true');
           window.location.href = window.location.href.split('?')[0] + '?v=' + new Date().getTime();
         }
      }
    }, true);
  </script>
  <script>
    (function() {
      try {
        var theme = 'dark';
        var appStore = localStorage.getItem('photo-app-store');
        var pref = null;
        if (appStore) {
          try {
            var parsed = JSON.parse(appStore);
            pref = parsed && parsed.state ? parsed.state.theme : null;
          } catch (_) {}
        }
        if (!pref) {
          pref = localStorage.getItem('photo-theme-preference');
        }

        if (pref === 'light' || pref === 'dark') {
          theme = pref;
        } else {
          var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = sysDark ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        
        var meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = theme === 'dark' ? '#0a0a0f' : '#fafafa';
        document.head.appendChild(meta);
      } catch (e) {}
    })();
  </script>

  <link rel="canonical" href="https://photosbyperkins.com/" />
  <link rel="preload" href="/assets/fonts/barlow-condensed-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/outfit-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/data/index.json?build=%BUILD_NUMBER%" as="fetch" crossorigin />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg?build=%BUILD_NUMBER%" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?build=%BUILD_NUMBER%" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="%VITE_SITE_APP_TITLE%">
  <meta name="description"
    content="%VITE_SITE_DESC%" />
  <meta name="keywords"
    content="%VITE_SITE_KEYWORDS%" />
  <meta property="og:title" content="%VITE_OG_TITLE%" />
  <meta property="og:description"
    content="%VITE_OG_DESC%" />
  <meta property="og:type" content="website" />
  <title>%VITE_SITE_TITLE%</title>

  <script type="application/ld+json">

        "name": "Photos by Perkins",
        "description": "Sacramento Roller Derby and Action Sports Photography by Michael Perkins."
      },
      {
        "@type": "Person",
        "@id": "https://photosbyperkins.com/#photographer",
        "name": "Michael Perkins",
        "url": "https://photosbyperkins.com/",
        "jobTitle": "Sports & Event Photographer",
        "sameAs": [
          "https://www.instagram.com/photosbyperkins",
          "https://www.facebook.com/photosbyperkins"
        ]
      }
    ]
  }
  </script>
</head>
