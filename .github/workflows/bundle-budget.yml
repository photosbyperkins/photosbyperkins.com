name: Bundle budget

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bundle-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Puppeteer is only used by local pipeline scripts; skip the Chromium download in CI.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Real .env is gitignored; the example provides the build-time VITE_* placeholders.
      - name: Prepare env
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Use the versions pinned in requirements-ml.txt (with the headless OpenCV build), so CI tests the
      # OpenCV the pipeline actually runs. Unpinned installs pick up OpenCV 5, whose Hershey glyphs
      # break the synthetic jersey-number eval.
      - name: Install Python ML test dependencies
        run: |
          grep -E '^(numpy|pillow|pytest)==' requirements-ml.txt > "$RUNNER_TEMP/ml-ci-requirements.txt"
          sed -n 's/^opencv-python==/opencv-python-headless==/p' requirements-ml.txt >> "$RUNNER_TEMP/ml-ci-requirements.txt"
          cat "$RUNNER_TEMP/ml-ci-requirements.txt"
          grep -q '^opencv-python-headless==' "$RUNNER_TEMP/ml-ci-requirements.txt"
          pip install -r "$RUNNER_TEMP/ml-ci-requirements.txt"

      - name: Run Python ML unit tests & >=90% precision evaluation gate
        run: npm run test:ml && npm run ml:eval

      - name: Build client
        run: npm run build:client

      - name: Check bundle budget
        run: npm run bundle:check

      - name: Prepare Lighthouse CI fixtures
        run: npm run lhci:fixtures && npm run build:client

      - name: Run Lighthouse CI gate
        run: npm run lhci

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: reports/bundle/
          if-no-files-found: ignore

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: reports/lighthouse/
          if-no-files-found: ignore
